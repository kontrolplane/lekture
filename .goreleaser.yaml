# Release configuration. Run "make release-check" to validate, or
# "goreleaser release --snapshot --clean" to build locally without publishing.
version: 2

project_name: lekture

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: lekture
    main: .
    binary: lekture
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    # Reproducible builds: stamp the commit date rather than the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: lekture
    ids:
      - lekture
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - src: example/presentation.md
        dst: example

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^(fix|perf)'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore: update dependencies'

release:
  draft: false
  prerelease: auto
  footer: |
    ## installation

    ```bash
    brew install kontrolplane/tap/lekture
    ```

    ```bash
    go install github.com/kontrolplane/lekture@{{ .Tag }}
    ```

    Or download a binary for your platform from the assets below.

homebrew_casks:
  - name: lekture
    ids:
      - lekture
    binaries:
      - lekture
    repository:
      owner: kontrolplane
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://kontrolplane.dev/projects/#lekture
    description: "A terminal user interface (TUI) for presenting markdown slideshows."
    license: MIT
    commit_author:
      use_github_app_token: true
    commit_msg_template: "{{ .ProjectName }}: update to {{ .Tag }}"
    # Prereleases leave the tap on the last stable version.
    skip_upload: auto
    hooks:
      post:
        # The binary is not notarized, so Gatekeeper would refuse to run it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lekture"]
          end
