name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # GITHUB_TOKEN is scoped to this repository, so the cask push to the
      # tap goes through the kontrolplane-bot app instead.
      - name: Create tap token
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KONTROLPLANE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.KONTROLPLANE_BOT_PRIVATE_KEY }}
          owner: kontrolplane
          repositories: homebrew-tap
          permission-contents: write

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
